<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Página oculta: não aparece em buscadores -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Cadastro - Kersten Oncologia</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Public Sans', sans-serif; }
    body { background: #f4f6f9; color: #1e293b; line-height: 1.6; }

    .page {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #fff; padding: 40px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px;
    }
    .card h1 { font-size: 1.5rem; margin-bottom: 8px; color: #0f172a; }
    .card p { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #334155; }
    input {
      width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #2563eb; }
    small.hint { display: block; margin-top: 4px; font-size: 0.78rem; color: #64748b; }

    .btn {
      width: 100%; padding: 11px 20px; border: none; border-radius: 8px; font-weight: 600;
      font-size: 0.95rem; cursor: pointer; transition: all 0.2s; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: #2563eb; color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; margin-top: 12px; }
    .btn-secondary:hover { background: #cbd5e1; }

    #success-box { display: none; text-align: center; }
    #success-box h1 { color: #16a34a; }

    .toast {
      position: fixed; top: 20px; right: 20px; padding: 14px 22px;
      border-radius: 8px; color: #fff; font-weight: 600; z-index: 999;
      display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.15); max-width: 90vw;
    }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="page">
    <div class="card">

      <!-- FORMULÁRIO DE CADASTRO -->
      <div id="form-box">
        <h1>Criar Cadastro</h1>
        <p>Preencha os dados abaixo para criar seu acesso ao painel de edição do site.</p>

        <form id="signup-form" autocomplete="off">
          <div class="form-group">
            <label for="signup-nome">Nome completo</label>
            <input type="text" id="signup-nome" required placeholder="Seu nome" />
          </div>
          <div class="form-group">
            <label for="signup-email">E-mail</label>
            <input type="email" id="signup-email" required placeholder="seu@email.com" />
          </div>
          <div class="form-group">
            <label for="signup-password">Senha</label>
            <input type="password" id="signup-password" required minlength="6" placeholder="••••••••" />
            <small class="hint">Mínimo de 6 caracteres.</small>
          </div>
          <div class="form-group">
            <label for="signup-password2">Confirmar senha</label>
            <input type="password" id="signup-password2" required minlength="6" placeholder="••••••••" />
          </div>
          <button type="submit" id="signup-btn" class="btn">Cadastrar</button>
        </form>
      </div>

      <!-- MENSAGEM DE SUCESSO -->
      <div id="success-box">
        <h1>Cadastro concluído!</h1>
        <p>Seu acesso foi criado com sucesso. Você já pode entrar no painel de edição.</p>
        <a href="admin.html" class="btn">Ir para o Painel</a>
      </div>

    </div>
  </div>

  <script type="module" src="cadastro.js"></script>
</body>
</html>
